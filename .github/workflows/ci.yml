name: Gara CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: "ci-only-secret-not-for-production-0123456789"
      BETTER_AUTH_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/gara"
      DIRECT_URL: "postgresql://postgres:postgres@127.0.0.1:5432/gara"
      DATABASE_SSL: "false"
      RESEND_API_KEY: "re_test_ci_only"
      EMAIL_FROM: "Gara CI <no-reply@example.com>"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
